name: "Terraform Deploy OCI (OIDC Token Exchange)"

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write   # Permite ao runner solicitar o token OIDC assinado pelo GitHub
  contents: read

jobs:
  terraform:
    name: "Terraform Plan & Apply"
    runs-on: ubuntu-latest

    # Mapeamento dos secrets para as variáveis de ambiente lidas pelo Terraform
    env:
      TF_VAR_tenancy_ocid: ${{ secrets.OCI_TENANCY_OCID }}
      TF_VAR_compartment_ocid: ${{ secrets.OCI_COMPARTMENT_OCID || 'ocid1.compartment.oc1..aaaaaaaa7qb7s6k27ewo6oyylxa7qguh3xkqlijnhqk7hyz3oyncznn2fx3a' }}
      TF_VAR_region: ${{ secrets.OCI_REGION }}
      TF_VAR_ssh_public_key_value: ${{ secrets.PUBLIC_KEY_VALUE }}
      TF_VAR_auth: "SecurityToken"
      TF_VAR_oci_config_profile: "DEFAULT"
      DEBUG: "true"

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      # Diagnóstico preliminar e teste de endpoint OCI
      - name: Diagnóstico OIDC e Teste de Endpoint OCI
        run: |
          set -e
          echo "=== 1. Inspecionando Token OIDC do GitHub Actions ==="
          OIDC_TOKEN=$(curl -sS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https://cloud.oracle.com" | jq -r '.value // empty')

          if [ -n "$OIDC_TOKEN" ]; then
            echo "Token OIDC obtido com sucesso."
            JWT_PAYLOAD=$(echo "$OIDC_TOKEN" | cut -d'.' -f2 | tr '_-' '/+' | base64 -d 2>/dev/null || true)
            echo "Claims do GitHub Actions JWT:"
            echo "$JWT_PAYLOAD" | jq '{iss, aud, sub, repository, ref}' || echo "$JWT_PAYLOAD"
          else
            echo "::warning::Falha ao obter token com audience https://cloud.oracle.com"
          fi

          echo "=== 2. Sanitizando URL do Domínio OCI ==="
          RAW_URL="${{ secrets.OCI_DOMAIN_URL }}"
          CLEAN_URL="${RAW_URL%/}"
          echo "CLEAN_DOMAIN_URL=${CLEAN_URL}" >> $GITHUB_ENV

          echo "=== 3. Teste de Comunicação e Validação da Resposta OCI ==="
          mkdir -p /tmp/diag_oci
          openssl genrsa -out /tmp/diag_oci/test_key.pem 2048 2>/dev/null
          TEST_PUB_KEY=$(openssl rsa -in /tmp/diag_oci/test_key.pem -pubout -outform DER 2>/dev/null | base64 -w 0)

          HTTP_RESPONSE=$(curl -sS -i -X POST "${CLEAN_URL}/oauth2/v1/token" \
            -u "${{ secrets.OCI_CLIENT_ID }}:${{ secrets.OCI_CLIENT_SECRET }}" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            --data-urlencode "grant_type=urn:ietf:params:oauth:grant-type:token-exchange" \
            --data-urlencode "requested_token_type=urn:oci:token-type:oci-upst" \
            --data-urlencode "public_key=${TEST_PUB_KEY}" \
            --data-urlencode "subject_token=${OIDC_TOKEN}" \
            --data-urlencode "subject_token_type=jwt" || true)

          echo "Resposta HTTP do Endpoint OCI:"
          echo "$HTTP_RESPONSE"
          rm -rf /tmp/diag_oci

      # Autenticação oficial OCI via OIDC Token Exchange (Guia Oficial Oracle A-Team)
      - name: Run OCI Token Exchange Action
        uses: gtrevorrow/oci-token-exchange-action@v2
        with:
          oidc_client_identifier: ${{ secrets.OCI_CLIENT_ID }}:${{ secrets.OCI_CLIENT_SECRET }}
          domain_base_url: ${{ env.CLEAN_DOMAIN_URL }}
          oci_tenancy: ${{ secrets.OCI_TENANCY_OCID }}
          oci_region: ${{ secrets.OCI_REGION }}
          oci_profile: 'DEFAULT'

      - name: Validar Perfil OCI Configurado
        run: |
          echo "Perfil OCI gerado com sucesso:"
          cat ~/.oci/config

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform Init
        run: |
          terraform init -backend-config="auth=SecurityToken" -backend-config="config_file_profile=DEFAULT"

      - name: Terraform Plan
        run: terraform plan -input=false

      - name: Terraform Apply
        run: terraform apply -auto-approve -input=false
