name: "Terraform Deploy OCI (OIDC Token Exchange)"

on:
  push:
    branches:
      - main

permissions:
  id-token: write   # Permite ao runner solicitar o token OIDC assinado pelo GitHub
  contents: read

jobs:
  terraform:
    name: "Terraform Plan & Apply"
    runs-on: ubuntu-latest

    # Mapeamento dos secrets para as variáveis de ambiente lidas pelo Terraform
    env:
      TF_VAR_tenancy_ocid: ${{ secrets.OCI_TENANCY_OCID }}
      TF_VAR_region: ${{ secrets.OCI_REGION }}
      TF_VAR_ssh_public_key: ${{ secrets.PUBLIC_KEY_VALUE }}

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Obter OCI Session Token (UPST) via OIDC
        run: |
          set -e

          # 1. Solicita o ID Token OIDC ao GitHub com a audience apontando para o Client ID
          OIDC_TOKEN=$(curl -sS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${{ secrets.OCI_CLIENT_ID }}" | jq -r '.value // empty')

          if [ -z "$OIDC_TOKEN" ]; then
            echo "::error::Falha ao obter o token OIDC do GitHub Actions. Verifique as permissões de id-token."
            exit 1
          fi

          # 2. Executa a troca de token no Identity Domain da OCI
          RESPONSE=$(curl -sS -X POST "${{ secrets.OCI_DOMAIN_URL }}/oauth2/v1/token" \
            -u "${{ secrets.OCI_CLIENT_ID }}:${{ secrets.OCI_CLIENT_SECRET }}" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            --data-urlencode "grant_type=urn:ietf:params:oauth:grant-type:token-exchange" \
            --data-urlencode "subject_token=${OIDC_TOKEN}" \
            --data-urlencode "subject_token_type=urn:ietf:params:oauth:token-type:jwt" \
            --data-urlencode "scope=urn:opc:idm:__myscopes__")

          UPST=$(echo "$RESPONSE" | jq -r '.access_token // empty')

          if [ -z "$UPST" ]; then
            echo "::error::Falha no Token Exchange com a OCI. Resposta recebida:"
            echo "$RESPONSE" | jq .
            exit 1
          fi

          # 3. Configura o perfil de sessão para o Terraform / OCI SDK
          mkdir -p ~/.oci
          echo "$UPST" > ~/.oci/oci_security_token

          cat <<EOF > ~/.oci/config
          [DEFAULT]
          tenancy=${{ secrets.OCI_TENANCY_OCID }}
          region=${{ secrets.OCI_REGION }}
          security_token_file=~/.oci/oci_security_token
          EOF

          echo "UPST configurado com sucesso para a sessão."

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        run: terraform plan -input=false

      - name: Terraform Apply
        run: terraform apply -auto-approve -input=false